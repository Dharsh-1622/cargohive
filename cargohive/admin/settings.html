<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar admin-sidebar" id="sidebar">
      <div class="sidebar-brand"><a href="../index.html" class="cs-logo cs-logo-white"><span class="cs-logo-mark">CH</span><span>CargoHive</span></a></div>
      <nav class="sidebar-nav">
        <a class="nav-link" data-nav="dashboard" href="dashboard.html"><span>📊</span> Dashboard</a>
        <a class="nav-link" data-nav="approvals" href="provider-approvals.html"><span>✓</span> Provider Approvals</a>
        <a class="nav-link" data-nav="providers" href="providers.html"><span>🚛</span> Providers</a>
        <a class="nav-link" data-nav="traders" href="traders.html"><span>📦</span> Traders</a>
        <a class="nav-link" data-nav="vehicles" href="vehicles.html"><span>🚚</span> Vehicles</a>
        <a class="nav-link" data-nav="bookings" href="bookings.html"><span>📋</span> Bookings</a>
        <a class="nav-link" data-nav="reports" href="reports.html"><span>📈</span> Reports</a>
        <a class="nav-link" data-nav="settings" href="settings.html"><span>⚙️</span> Settings</a>
      </nav>
      <div class="sidebar-footer"><button class="btn btn-ghost btn-block" style="color:rgba(255,255,255,0.8);justify-content:flex-start" onclick="CS.logout('../index.html')">Logout</button></div>
    </aside>
    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left"><button class="menu-toggle" id="menu-toggle">☰</button>
          <div class="page-title" style="font-size:1.25rem;margin:0">Settings</div></div>
      </header>
      <main class="page-body">
        <div class="grid-2" style="align-items:start">
          <div class="card mb-4">
            <h3 class="card-title mb-4">Platform Settings</h3>
            <div class="form-group"><label class="form-label">Platform Name</label><input class="form-input" id="platformName" /></div>
            <div class="form-group"><label class="form-label">Support Email</label><input class="form-input" id="supportEmail" /></div>
          </div>
          <div class="card mb-4">
            <h3 class="card-title mb-4">Booking Rules</h3>
            <div class="form-group"><label class="form-label">Maximum cargo weight (KG)</label><input class="form-input" type="number" id="maxCargoWeight" /></div>
            <div class="form-group"><label class="form-label">Minimum booking space (CBM)</label><input class="form-input" type="number" step="0.1" id="minBookingCbm" /></div>
            <div class="form-group"><label class="form-label">Cancellation window (hours)</label><input class="form-input" type="number" id="cancellationWindowHours" /></div>
            <div class="form-group"><label class="form-label">Service fee (%)</label><input class="form-input" type="number" id="serviceFeePercent" /></div>
          </div>
          <div class="card mb-4">
            <h3 class="card-title mb-4">Notification Settings</h3>
            <label class="form-check"><input type="checkbox" id="notifyBookings" checked /> Email on new bookings</label>
            <label class="form-check"><input type="checkbox" id="notifyProviders" checked /> Email on provider registrations</label>
            <label class="form-check"><input type="checkbox" id="notifyCancellations" checked /> Alert on cancellations</label>
          </div>
          <div class="card mb-4">
            <h3 class="card-title mb-4">Security</h3>
            <div class="notice notice-info mb-3">Admin sessions are mock-only for this hackathon demo. No real authentication backend.</div>
            <label class="form-check"><input type="checkbox" id="require2fa" /> Require 2FA for admin (demo toggle)</label>
            <label class="form-check"><input type="checkbox" id="auditLog" checked /> Keep audit log of approvals</label>
          </div>
        </div>
        <button class="btn btn-primary btn-lg" id="save">Save Settings</button>
      </main>
    </div>
  </div>
  <script src="../js/common.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    const session = CS.requireRole('admin', 'login.html');
    if (session) {
      CS.initSidebar(); CS.setActiveNav('settings');
      const s = CS.getSettings();
      platformName.value = s.platformName || 'CargoHive';
      supportEmail.value = s.supportEmail || 'support@cargohive.example';
      maxCargoWeight.value = s.maxCargoWeight || 10000;
      minBookingCbm.value = s.minBookingCbm || 0.5;
      cancellationWindowHours.value = s.cancellationWindowHours || 12;
      serviceFeePercent.value = s.serviceFeePercent || 10;
      document.getElementById('save').onclick = () => {
        AdminApp.saveSettings({
          platformName: platformName.value.trim(),
          supportEmail: supportEmail.value.trim(),
          maxCargoWeight: Number(maxCargoWeight.value),
          minBookingCbm: Number(minBookingCbm.value),
          cancellationWindowHours: Number(cancellationWindowHours.value),
          serviceFeePercent: Number(serviceFeePercent.value),
          notifyBookings: notifyBookings.checked,
          notifyProviders: notifyProviders.checked,
          notifyCancellations: notifyCancellations.checked,
          require2fa: require2fa.checked,
          auditLog: auditLog.checked,
        });
      };
    }
  </script>
</body>
</html>
