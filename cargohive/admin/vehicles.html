<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicles — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar admin-sidebar" id="sidebar">
      <div class="sidebar-brand"><a href="../index.html" class="cs-logo cs-logo-white"><span class="cs-logo-mark">CH</span><span>CargoHive</span></a></div>
      <nav class="sidebar-nav">
        <a class="nav-link" data-nav="dashboard" href="dashboard.html"><span>📊</span> Dashboard</a>
        <a class="nav-link" data-nav="approvals" href="provider-approvals.html"><span>✓</span> Provider Approvals</a>
        <a class="nav-link" data-nav="providers" href="providers.html"><span>🚛</span> Providers</a>
        <a class="nav-link" data-nav="traders" href="traders.html"><span>📦</span> Traders</a>
        <a class="nav-link" data-nav="vehicles" href="vehicles.html"><span>🚚</span> Vehicles</a>
        <a class="nav-link" data-nav="bookings" href="bookings.html"><span>📋</span> Bookings</a>
        <a class="nav-link" data-nav="reports" href="reports.html"><span>📈</span> Reports</a>
        <a class="nav-link" data-nav="settings" href="settings.html"><span>⚙️</span> Settings</a>
      </nav>
      <div class="sidebar-footer"><button class="btn btn-ghost btn-block" style="color:rgba(255,255,255,0.8);justify-content:flex-start" onclick="CS.logout('../index.html')">Logout</button></div>
    </aside>
    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left"><button class="menu-toggle" id="menu-toggle">☰</button>
          <div class="page-title" style="font-size:1.25rem;margin:0">All Vehicles</div></div>
      </header>
      <main class="page-body">
        <div class="tabs" id="tabs">
          <button class="tab-btn active" data-f="All">All</button>
          <button class="tab-btn" data-f="Available">Available</button>
          <button class="tab-btn" data-f="Partially Booked">Partially Booked</button>
          <button class="tab-btn" data-f="Fully Booked">Fully Booked</button>
          <button class="tab-btn" data-f="Inactive">Inactive</button>
        </div>
        <div id="list"></div>
      </main>
    </div>
  </div>
  <script src="../js/common.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    const session = CS.requireRole('admin', 'login.html');
    if (session) {
      CS.initSidebar(); CS.setActiveNav('vehicles');
      let filter = 'All';
      const list = document.getElementById('list');
      function refresh() { AdminApp.renderVehicles(list, filter); }
      document.getElementById('tabs').onclick = (e) => {
        const btn = e.target.closest('.tab-btn'); if (!btn) return;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); filter = btn.dataset.f; refresh();
      };
      refresh();
    }
  </script>
</body>
</html>
