<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CargoHive Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-visual" style="background:linear-gradient(160deg,#050b14,#0a1628 50%,#0f2744)">
      <a href="../index.html" class="cs-logo cs-logo-white"><span class="cs-logo-mark">CH</span><span>CargoHive</span></a>
      <div>
        <h2 style="font-size:2rem;font-weight:700;margin:0 0 12px">Platform control</h2>
        <p style="opacity:0.7;line-height:1.6">Verify providers, monitor bookings, and keep CargoHive trusted.</p>
      </div>
      <div class="text-sm" style="opacity:0.5">Secure admin access · Demo: admin@cargohive.example / admin123</div>
    </div>
    <div class="auth-form-wrap">
      <div class="auth-card">
        <h1 class="auth-title">CargoHive Admin</h1>
        <p class="auth-sub">Sign in to the operations console.</p>
        <form id="login-form">
          <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" id="email" required value="admin@cargohive.example" /></div>
          <div class="form-group"><label class="form-label">Password</label><input class="form-input" type="password" id="password" required value="admin123" /></div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Admin Login</button>
        </form>
        <p class="text-sm text-muted mt-4" style="text-align:center"><a href="../index.html" style="color:var(--cs-blue)">← Back to CargoHive</a></p>
      </div>
    </div>
  </div>
  <script src="../js/common.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.getElementById('login-form').onsubmit = (e) => {
      e.preventDefault();
      AdminApp.login(email.value.trim(), password.value);
    };
  </script>
</body>
</html>
