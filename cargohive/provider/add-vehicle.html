<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Vehicle — CargoHive</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><a href="../index.html" class="cs-logo cs-logo-white"><span class="cs-logo-mark">CH</span><span>CargoHive</span></a></div>
      <nav class="sidebar-nav">
        <a class="nav-link" data-nav="dashboard" href="dashboard.html"><span>📊</span> Dashboard</a>
        <a class="nav-link" data-nav="vehicles" href="vehicles.html"><span>🚛</span> My Vehicles</a>
        <a class="nav-link" data-nav="add-vehicle" href="add-vehicle.html"><span>➕</span> Add Vehicle</a>
        <a class="nav-link" data-nav="availability" href="availability.html"><span>📐</span> Availability</a>
        <a class="nav-link" data-nav="bookings" href="bookings.html"><span>📋</span> Bookings</a>
        <a class="nav-link" data-nav="chat" href="chat.html"><span>💬</span> Messages</a>
        <a class="nav-link" data-nav="notifications" href="notifications.html"><span>🔔</span> Notifications</a>
        <a class="nav-link" data-nav="profile" href="profile.html"><span>👤</span> Profile</a>
      </nav>
      <div class="sidebar-footer"><button class="btn btn-ghost btn-block" style="color:rgba(255,255,255,0.8);justify-content:flex-start" onclick="CS.logout('../index.html')">Logout</button></div>
    </aside>
    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left"><button class="menu-toggle" id="menu-toggle">☰</button>
          <div class="page-title" style="font-size:1.25rem;margin:0">Add Vehicle</div></div>
      </header>
      <main class="page-body">
        <div class="card" style="max-width:720px">
          <div id="form-feedback" style="display:none;margin-bottom:1rem;padding:0.75rem 1rem;border-radius:0.5rem;font-size:0.875rem;"></div>
          <form id="add-form">
            <div class="form-row">
              <div class="form-group"><label class="form-label">Vehicle Number</label><input class="form-input" id="vehicleNumber" required placeholder="TN-33-XX-0000" /><div class="form-error">Required</div></div>
              <div class="form-group"><label class="form-label">Vehicle Type</label>
                <select class="form-select" id="vehicleType" required>
                  <option>Mini Truck</option><option>Pickup Van</option><option selected>10 CBM Truck</option>
                  <option>Closed Container Truck</option><option>Lorry</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group"><label class="form-label">Total CBM</label><input class="form-input" type="number" id="totalCbm" required value="10" /></div>
              <div class="form-group"><label class="form-label">Maximum Weight (KG)</label><input class="form-input" type="number" id="maxWeight" required value="2000" /></div>
            </div>
            <h3 class="card-title mb-3 mt-2">Route</h3>
            <div class="form-row">
              <div class="form-group"><label class="form-label">Start Location</label><input class="form-input" id="start" required value="Erode" /></div>
              <div class="form-group"><label class="form-label">Stop 1</label><input class="form-input" id="stop1" value="Salem" /></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label class="form-label">Stop 2</label><input class="form-input" id="stop2" /></div>
              <div class="form-group"><label class="form-label">Destination</label><input class="form-input" id="destination" required value="Chennai" /></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label class="form-label">Departure Date</label><input class="form-input" type="date" id="departureDate" required value="2026-03-15" /></div>
              <div class="form-group"><label class="form-label">Departure Time</label><input class="form-input" type="time" id="departureTime" required value="08:00" /></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label class="form-label">Estimated Arrival Date</label><input class="form-input" type="date" id="etaDate" required value="2026-03-15" /></div>
              <div class="form-group"><label class="form-label">Estimated Arrival Time</label><input class="form-input" type="time" id="etaTime" required value="14:00" /></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label class="form-label">Available CBM</label><input class="form-input" type="number" id="availableCbm" required value="10" /></div>
              <div class="form-group"><label class="form-label">Available Weight</label><input class="form-input" type="number" id="availableWeight" required value="2000" /></div>
            </div>
            <div class="form-group"><label class="form-label">Price per CBM (₹)</label><input class="form-input" type="number" id="pricePerCbm" value="1200" /></div>
            <div class="flex gap-3 mb-4" style="flex-wrap:wrap">
              <label class="form-check" style="margin:0"><input type="checkbox" id="tempControlled" /> Temperature Controlled?</label>
              <label class="form-check" style="margin:0"><input type="checkbox" id="refrigerated" /> Refrigerated?</label>
              <label class="form-check" style="margin:0"><input type="checkbox" id="hazardousAllowed" /> Hazardous Cargo Allowed?</label>
              <label class="form-check" style="margin:0"><input type="checkbox" id="fragileSupported" checked /> Fragile Cargo Supported?</label>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Add Vehicle</button>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script src="../js/common.js"></script>
  <script src="../js/provider.js"></script>
  <script>
    // Get existing session if available
    const session = (window.CS && typeof CS.getSession === 'function') ? CS.getSession() : null;
    if (window.CS && typeof CS.initSidebar === 'function') CS.initSidebar();
    if (window.CS && typeof CS.setActiveNav === 'function') CS.setActiveNav('add-vehicle');

    function showFeedback(message, type) {
      const box = document.getElementById('form-feedback');
      if (!box) return;
      box.style.display = 'block';
      if (type === 'success') {
        box.style.backgroundColor = '#ecfdf5';
        box.style.color = '#065f46';
        box.style.border = '1px solid #a7f3d0';
        box.innerHTML = '✅ ' + message;
      } else {
        box.style.backgroundColor = '#fef2f2';
        box.style.color = '#991b1b';
        box.style.border = '1px solid #fecaca';
        box.innerHTML = '❌ ' + message;
      }
    }

    function hideFeedback() {
      const box = document.getElementById('form-feedback');
      if (box) box.style.display = 'none';
    }

    const form = document.getElementById('add-form');
    const submitBtn = form.querySelector('button[type="submit"]');

    form.onsubmit = async (e) => {
      e.preventDefault();
      hideFeedback();

      const vehicleNum = document.getElementById('vehicleNumber').value.trim();
      const vType = document.getElementById('vehicleType').value;
      const startLoc = document.getElementById('start').value.trim();
      const destLoc = document.getElementById('destination').value.trim();
      const depDate = document.getElementById('departureDate').value;
      const depTime = document.getElementById('departureTime').value;
      const totalCbmVal = document.getElementById('totalCbm').value;
      const availCbmVal = document.getElementById('availableCbm').value;
      const maxWeightVal = document.getElementById('maxWeight').value;
      const availWeightVal = document.getElementById('availableWeight').value;
      const priceVal = document.getElementById('pricePerCbm').value;

      // 1. Required fields validation
      if (!vehicleNum || !vType || !startLoc || !destLoc || !depDate ||
          totalCbmVal === '' || availCbmVal === '' || maxWeightVal === '' || availWeightVal === '') {
        showFeedback('Please fill in all required fields.', 'error');
        if (window.CS && CS.toast) CS.toast('Fill in all required fields', 'error');
        return;
      }

      const totalCBM = Number(totalCbmVal);
      const availableCBM = Number(availCbmVal);
      const maxWeightKG = Number(maxWeightVal);
      const availableWeightKG = Number(availWeightVal);

      if (isNaN(totalCBM) || isNaN(availableCBM) || isNaN(maxWeightKG) || isNaN(availableWeightKG)) {
        showFeedback('Capacity and weight must be valid numbers.', 'error');
        if (window.CS && CS.toast) CS.toast('Invalid numbers in capacity or weight', 'error');
        return;
      }

      // 2. Numeric range validation
      if (totalCBM <= 0) {
        showFeedback('Total Capacity (CBM) must be greater than 0.', 'error');
        if (window.CS && CS.toast) CS.toast('Total capacity must be > 0', 'error');
        return;
      }

      if (availableCBM < 0) {
        showFeedback('Available Capacity (CBM) must be greater than or equal to 0.', 'error');
        if (window.CS && CS.toast) CS.toast('Available capacity must be >= 0', 'error');
        return;
      }

      if (availableCBM > totalCBM) {
        showFeedback('Available Capacity (CBM) cannot exceed Total Capacity.', 'error');
        if (window.CS && CS.toast) CS.toast('Available CBM cannot exceed total CBM', 'error');
        return;
      }

      if (maxWeightKG <= 0) {
        showFeedback('Maximum Weight (KG) must be greater than 0.', 'error');
        if (window.CS && CS.toast) CS.toast('Max weight must be > 0', 'error');
        return;
      }

      if (availableWeightKG < 0) {
        showFeedback('Available Weight (KG) must be greater than or equal to 0.', 'error');
        if (window.CS && CS.toast) CS.toast('Available weight must be >= 0', 'error');
        return;
      }

      if (availableWeightKG > maxWeightKG) {
        showFeedback('Available Weight (KG) cannot exceed Maximum Weight.', 'error');
        if (window.CS && CS.toast) CS.toast('Available weight cannot exceed max weight', 'error');
        return;
      }

      const providerName = (session && (session.companyName || session.name)) || 'GV Transport';

      const payload = {
        providerName: providerName,
        vehicleType: vType,
        vehicleNumber: vehicleNum,
        fromLocation: startLoc,
        toLocation: destLoc,
        pickupDate: depDate,
        departureTime: depTime || '',
        totalCapacityCBM: totalCBM,
        availableCapacityCBM: availableCBM,
        maxWeightKG: maxWeightKG,
        availableWeightKG: availableWeightKG,
        pricePerCBM: priceVal !== '' ? Number(priceVal) : undefined,
        status: 'Available'
      };

      const API_URL = (window.location.hostname === 'localhost' && window.location.port === '5000')
        ? '/api/vehicles'
        : 'http://localhost:5000/api/vehicles';

      submitBtn.disabled = true;
      const originalText = submitBtn.textContent;
      submitBtn.textContent = 'Saving...';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok && result.success) {
          showFeedback('Vehicle added successfully to the database!', 'success');
          if (window.CS && CS.toast) {
            CS.toast('Vehicle added successfully!', 'success');
          }

          // Clear the form
          form.reset();
          const inputsToClear = form.querySelectorAll('input:not([type=checkbox]):not([type=radio])');
          inputsToClear.forEach(input => { input.value = ''; });
        } else {
          const errMsg = result.message || 'Failed to add vehicle.';
          showFeedback(errMsg, 'error');
          if (window.CS && CS.toast) {
            CS.toast(errMsg, 'error');
          }
        }
      } catch (err) {
        console.error('Fetch error:', err);
        const netErr = 'Could not connect to server. Please ensure the backend is running on port 5000.';
        showFeedback(netErr, 'error');
        if (window.CS && CS.toast) {
          CS.toast(netErr, 'error');
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    };
  </script>
</body>
</html>
