<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Success — CargoHive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { cs: { navy: '#0b1f3a', blue: '#1d4ed8', sky: '#0ea5e9' } },
          fontFamily: { sans: ['DM Sans', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <a href="../index.html" class="cs-logo cs-logo-white">
          <span class="cs-logo-mark">CH</span>
          <span>CargoHive</span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-link" href="dashboard.html" data-nav="dashboard"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M4 5h7v7H4V5zm9 0h7v5h-7V5zM4 14h7v5H4v-5zm9 2h7v3h-7v-3z"/></svg> Dashboard</a>
        <a class="nav-link" href="search-space.html" data-nav="search"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke-width="2"/><path stroke-width="2" d="M20 20l-3-3"/></svg> Search Space</a>
        <a class="nav-link" href="bookings.html" data-nav="bookings"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M8 7h8M8 11h8M8 15h5M6 3h12a2 2 0 012 2v14l-4-2-4 2-4-2-4 2V5a2 2 0 012-2z"/></svg> Bookings</a>
        <a class="nav-link" href="chat.html" data-nav="chat"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M8 10h8M8 14h5M21 12a9 9 0 11-3.5-7.1L21 5v7z"/></svg> Chat</a>
        <a class="nav-link" href="notifications.html" data-nav="notifications"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h5m6 0a3 3 0 11-6 0"/></svg> Notifications</a>
        <a class="nav-link" href="profile.html" data-nav="profile"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M12 12a4 4 0 100-8 4 4 0 000 8zm-7 9a7 7 0 0114 0"/></svg> Profile</a>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-link w-full" type="button" onclick="CS.logout('../index.html')">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M15 12H4m0 0l3-3m-3 3l3 3m5-10h5a2 2 0 012 2v12a2 2 0 01-2 2h-5"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Menu">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div>
            <div class="font-semibold text-navy" id="topbar-name">Trader</div>
            <div class="text-xs text-muted">Payment confirmation</div>
          </div>
        </div>
      </header>

      <main class="page-body">
        <div class="card" style="max-width:660px;margin:0 auto;text-align:center" id="success-root">
          <div class="empty-state"><div class="loading-spinner"></div></div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/trader.js"></script>
  <script>
    const session = CS.requireRole("trader", "login.html");
    if (session) {
      CS.initSidebar();
      CS.setActiveNav("bookings");
      document.getElementById("topbar-name").textContent = session.name || "Trader";

      // Read receipt from localStorage or last booking
      let receipt = null;
      try {
        receipt = JSON.parse(localStorage.getItem("cs_last_payment_receipt") || "null");
      } catch (e) {}

      const lastBooking = TraderApp.getLastBooking();
      const root = document.getElementById("success-root");

      if (!receipt && !lastBooking) {
        root.innerHTML = '<div class="empty-state"><p>No recent payment record found.</p><a class="btn btn-primary mt-4" href="dashboard.html">Go to Dashboard</a></div>';
      } else {
        const b = lastBooking || {};
        const bId = receipt?.bookingId || b.id || "BK-CONFIRMED";
        const providerName = receipt?.provider || b.providerName || "Transport Partner";
        const cargoName = receipt?.cargo || b.cargoName || "Cargo";
        const route = receipt?.route || b.route || ["Origin", "Destination"];
        const cbm = receipt?.cbm !== undefined ? receipt.cbm : (b.cbm || 2.4);
        const weight = receipt?.weight !== undefined ? receipt.weight : (b.weight || 350);
        const totalAmount = receipt?.totalAmount || b.total || 2880;
        const amountPaid = receipt?.amountPaid || b.amountPaid || Math.round(totalAmount * 0.5);
        const remainingAmount = receipt?.remainingAmount !== undefined ? receipt.remainingAmount : (totalAmount - amountPaid);
        const status = receipt?.paymentStatus || b.paymentStatus || "Advance Paid";
        const txnId = receipt?.transactionId || b.txnId || "TXN" + Date.now().toString().slice(-8);
        const receiptNo = receipt?.receiptNumber || ("RCPT-" + Date.now().toString().slice(-6));
        const paymentDate = receipt?.paymentDate ? new Date(receipt.paymentDate).toLocaleString("en-IN") : new Date().toLocaleString("en-IN");

        const isFullyPaid = status === "Fully Paid" || remainingAmount === 0;

        root.innerHTML = `
          <div style="width:72px;height:72px;border-radius:50%;background:var(--cs-success-bg);color:var(--cs-success);display:grid;place-items:center;margin:0 auto 20px;font-size:2rem;font-weight:700">✓</div>
          <h1 class="page-title" style="text-align:center">${isFullyPaid ? "Payment Completed!" : "Advance Payment Successful!"}</h1>
          <p class="page-sub" style="text-align:center">
            ${isFullyPaid ? "All payments have been settled. Shipment is fully paid." : "Your 50% advance has been processed via Razorpay Test Mode. Capacity is confirmed!"}
          </p>

          <div class="notice notice-success" style="text-align:left;margin-bottom:24px">
            <div class="flex-between mb-2">
              <div>
                <strong class="text-navy" style="font-size:1.15rem">${bId}</strong>
                <div class="text-xs text-muted">Receipt No: ${receiptNo}</div>
              </div>
              <div>${CS.statusBadge(status)}</div>
            </div>

            <div class="text-sm font-semibold text-slate-700 mt-2">${providerName} · ${cargoName}</div>
            <div class="route-line text-sm mt-1 mb-3">${CS.formatRoute(route)}</div>

            <div class="grid-2 gap-2 text-xs bg-white/70 p-3 rounded-lg border border-emerald-200 mb-3">
              <div><span class="text-muted">Space:</span> <strong>${cbm} CBM</strong></div>
              <div><span class="text-muted">Weight:</span> <strong>${weight} KG</strong></div>
              <div><span class="text-muted">Payment Date:</span> <strong>${paymentDate}</strong></div>
              <div><span class="text-muted">Gateway:</span> <strong>Razorpay (Test Mode)</strong></div>
            </div>

            <div class="space-y-1 text-sm pt-2 border-t border-emerald-200">
              <div class="flex-between"><span class="text-muted">Total Booking Amount:</span><strong>${CS.formatINR(totalAmount)}</strong></div>
              <div class="flex-between"><span class="text-emerald-700 font-semibold">Amount Paid:</span><strong class="text-emerald-700">${CS.formatINR(amountPaid)}</strong></div>
              <div class="flex-between"><span class="text-amber-800 font-semibold">Remaining Due Upon Delivery:</span><strong class="text-amber-800">${CS.formatINR(remainingAmount)}</strong></div>
            </div>

            <div class="text-xs text-muted mt-3 pt-2 border-t border-emerald-200 flex-between">
              <span>Txn: <code style="font-family:monospace">${txnId}</code></span>
              <span class="badge badge-info" style="font-size:0.7rem">Razorpay Test</span>
            </div>
          </div>

          <div class="flex gap-3" style="justify-content:center;flex-wrap:wrap">
            <button class="btn btn-primary" id="btn-download-receipt">
              📄 Download Receipt
            </button>
            <a class="btn btn-outline" href="booking-details.html?id=${encodeURIComponent(bId)}">
              View Booking Details
            </a>
            <a class="btn btn-secondary" href="dashboard.html">
              Dashboard
            </a>
          </div>`;

        // Attach Receipt Download
        const receiptData = {
          bookingId: bId,
          trader: session.businessName || session.name,
          provider: providerName,
          route: route,
          cargo: cargoName,
          cbm: cbm,
          weight: weight,
          totalAmount: totalAmount,
          amountPaid: amountPaid,
          remainingAmount: remainingAmount,
          paymentStatus: status,
          paymentDate: paymentDate,
          paymentMethod: "Razorpay (Test Mode)",
          transactionId: txnId,
          receiptNumber: receiptNo,
        };

        document.getElementById("btn-download-receipt")?.addEventListener("click", () => {
          CS.downloadReceipt(receiptData);
          CS.toast("Receipt downloaded successfully!", "success");
        });
      }
    }
  </script>
</body>
</html>
