<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Cargo Space — CargoHive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { cs: { navy: '#0b1f3a', blue: '#1d4ed8', sky: '#0ea5e9' } },
          fontFamily: { sans: ['DM Sans', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <a href="../index.html" class="cs-logo cs-logo-white">
          <span class="cs-logo-mark">CH</span>
          <span>CargoHive</span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-link" href="dashboard.html" data-nav="dashboard"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M4 5h7v7H4V5zm9 0h7v5h-7V5zM4 14h7v5H4v-5zm9 2h7v3h-7v-3z"/></svg> Dashboard</a>
        <a class="nav-link" href="search-space.html" data-nav="search"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke-width="2"/><path stroke-width="2" d="M20 20l-3-3"/></svg> Search Space</a>
        <a class="nav-link" href="bookings.html" data-nav="bookings"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M8 7h8M8 11h8M8 15h5M6 3h12a2 2 0 012 2v14l-4-2-4 2-4-2-4 2V5a2 2 0 012-2z"/></svg> Bookings</a>
        <a class="nav-link" href="chat.html" data-nav="chat"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M8 10h8M8 14h5M21 12a9 9 0 11-3.5-7.1L21 5v7z"/></svg> Chat</a>
        <a class="nav-link" href="notifications.html" data-nav="notifications"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h5m6 0a3 3 0 11-6 0"/></svg> Notifications</a>
        <a class="nav-link" href="profile.html" data-nav="profile"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M12 12a4 4 0 100-8 4 4 0 000 8zm-7 9a7 7 0 0114 0"/></svg> Profile</a>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-link w-full" type="button" onclick="CS.logout('../index.html')">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M15 12H4m0 0l3-3m-3 3l3 3m5-10h5a2 2 0 012 2v12a2 2 0 01-2 2h-5"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Menu">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div>
            <div class="font-semibold text-navy" id="topbar-name">Trader</div>
            <div class="text-xs text-muted">Search shared capacity</div>
          </div>
        </div>
      </header>

      <main class="page-body">
        <h1 class="page-title">Search Cargo Space</h1>
        <p class="page-sub">Find verified trucks with free CBM on your corridor — from Tiruppur textiles to Chennai port.</p>

        <div class="card mb-6">
          <form id="search-form">
            <div class="grid-2" style="gap:14px">
              <div class="form-group" style="margin:0">
                <label class="form-label" for="from">From</label>
                <input class="form-input" id="from" placeholder="Erode, Tiruppur, Coimbatore…" />
              </div>
              <div class="form-group" style="margin:0">
                <label class="form-label" for="to">To</label>
                <input class="form-input" id="to" placeholder="Chennai, Bangalore…" />
              </div>
              <div class="form-group" style="margin:0">
                <label class="form-label" for="pickupDate">Pickup Date</label>
                <input class="form-input" type="date" id="pickupDate" />
              </div>
              <div class="form-group" style="margin:0">
                <label class="form-label" for="cbm">Required CBM</label>
                <input class="form-input" type="number" id="cbm" min="0.1" step="0.1" placeholder="e.g. 2" />
              </div>
              <div class="form-group" style="margin:0">
                <label class="form-label" for="weight">Cargo Weight (KG)</label>
                <input class="form-input" type="number" id="weight" min="1" placeholder="e.g. 350" />
              </div>
              <div class="form-group" style="margin:0">
                <label class="form-label" for="maxPrice">Max Price / CBM (₹)</label>
                <input class="form-input" type="number" id="maxPrice" min="0" placeholder="e.g. 1500" />
              </div>
            </div>
            <div class="mt-4">
              <div class="form-label">Filters</div>
              <div class="filters-row" id="filter-chips">
                <button type="button" class="filter-chip" data-filter="vehicleType" data-value="All">All Vehicles</button>
                <button type="button" class="filter-chip" data-filter="vehicleType" data-value="10 CBM Truck">10 CBM Truck</button>
                <button type="button" class="filter-chip" data-filter="vehicleType" data-value="Closed Container Truck">Closed Container</button>
                <button type="button" class="filter-chip" data-filter="vehicleType" data-value="Mini Truck">Mini Truck</button>
                <button type="button" class="filter-chip" data-filter="vehicleType" data-value="Lorry">Lorry</button>
                <button type="button" class="filter-chip" data-filter="vehicleType" data-value="Pickup Van">Pickup Van</button>
                <button type="button" class="filter-chip" data-filter="verifiedOnly" data-value="1">Verified</button>
                <button type="button" class="filter-chip" data-filter="temp" data-value="1">Temp Controlled</button>
                <button type="button" class="filter-chip" data-filter="fragile" data-value="1">Fragile OK</button>
              </div>
            </div>
            <div class="flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary">Search Vehicles</button>
              <button type="button" class="btn btn-secondary" id="reset-btn">Reset</button>
            </div>
          </form>
        </div>

        <div class="flex-between mb-4">
          <h2 class="card-title" id="results-title">Matching vehicles</h2>
          <span class="text-sm text-muted" id="results-count"></span>
        </div>
        <div id="results" class="grid-2"></div>
      </main>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/trader.js"></script>
  <script>
    // Safe session check
    const session = (window.CS && typeof CS.getSession === "function") ? CS.getSession() : null;
    if (window.CS && typeof CS.initSidebar === "function") CS.initSidebar();
    if (window.CS && typeof CS.setActiveNav === "function") CS.setActiveNav("search");
    const topbarName = document.getElementById("topbar-name");
    if (topbarName) topbarName.textContent = (session && session.name) ? session.name : "Trader";

    const API_URL = (window.location.hostname === "localhost" && window.location.port === "5000")
      ? "/api/vehicles"
      : "http://localhost:5000/api/vehicles";

    let allVehicles = [];
    const activeFilters = { vehicleType: "All" };

    // Setup filter chips
    document.querySelectorAll("#filter-chips .filter-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        const key = chip.dataset.filter;
        const val = chip.dataset.value;
        if (key === "vehicleType") {
          document.querySelectorAll('[data-filter="vehicleType"]').forEach((c) => c.classList.remove("active"));
          chip.classList.add("active");
          activeFilters.vehicleType = val;
        } else {
          chip.classList.toggle("active");
          activeFilters[key] = chip.classList.contains("active");
        }
        applyFilters();
      });
    });

    const defaultChip = document.querySelector('[data-value="All"]');
    if (defaultChip) defaultChip.classList.add("active");

    function renderVehicleCard(v) {
      const providerName = v.providerName || "Provider";
      const vehicleType = v.vehicleType || "Commercial Vehicle";
      const vehicleNumber = v.vehicleNumber || "-";
      const fromLocation = v.fromLocation || "-";
      const toLocation = v.toLocation || "-";
      const pickupDate = v.pickupDate || "-";
      const departureTime = v.departureTime ? v.departureTime : "Flexible";
      const totalCapacity = Number(v.totalCapacityCBM || 0);
      const availableCapacity = Number(v.availableCapacityCBM || 0);
      const availableWeight = Number(v.availableWeightKG || 0);
      const pricePerCBM = (v.pricePerCBM !== undefined && v.pricePerCBM !== null && v.pricePerCBM !== "") 
        ? "₹" + Number(v.pricePerCBM).toLocaleString("en-IN") 
        : "₹0";
      const status = v.status || "Available";

      // Capacity bar percentage
      const occupied = Math.max(0, totalCapacity - availableCapacity);
      const pct = totalCapacity > 0 ? Math.min(100, Math.round((occupied / totalCapacity) * 100)) : 0;

      return `
        <div class="vehicle-card">
          <div class="flex-between mb-3">
            <div>
              <div class="flex-center gap-2" style="display:flex;align-items:center;gap:8px">
                <strong class="text-navy" style="font-size:1.05rem">${providerName}</strong>
                <span class="badge" style="background:#ecfdf5;color:#065f46;font-size:0.75rem;padding:2px 8px;border-radius:9999px;font-weight:600">${status}</span>
              </div>
              <div class="text-sm text-muted mt-1">${vehicleType} · <span style="font-family:monospace;font-weight:600">${vehicleNumber}</span></div>
            </div>
            <div class="text-right" style="text-align:right">
              <div class="price-tag" style="font-size:1.25rem;font-weight:700;color:var(--cs-blue)">${pricePerCBM}</div>
              <div class="text-xs text-muted">/ CBM</div>
            </div>
          </div>

          <div class="route-line mb-3">
            <span class="route-dot"></span>
            <span>${fromLocation}</span>
            <span class="route-arrow">→</span>
            <span class="route-dot" style="background:var(--cs-navy)"></span>
            <span>${toLocation}</span>
          </div>

          <div class="grid-3 mb-3" style="gap:10px;background:#f8fafc;padding:10px 12px;border-radius:8px">
            <div>
              <div class="info-label" style="font-size:0.75rem;color:#64748b">Available CBM</div>
              <div class="info-value" style="font-weight:700;color:#0f172a">${availableCapacity} CBM</div>
            </div>
            <div>
              <div class="info-label" style="font-size:0.75rem;color:#64748b">Available Weight</div>
              <div class="info-value" style="font-weight:700;color:#0f172a">${availableWeight} KG</div>
            </div>
            <div>
              <div class="info-label" style="font-size:0.75rem;color:#64748b">Total Capacity</div>
              <div class="info-value" style="font-weight:700;color:#0f172a">${totalCapacity} CBM</div>
            </div>
          </div>

          <div class="capacity-bar mb-2"><div class="capacity-filled" style="width:${pct}%"></div></div>

          <div class="flex-between text-xs text-muted" style="display:flex;justify-content:space-between;padding-top:6px;border-top:1px solid #f1f5f9">
            <span><strong>Pickup Date:</strong> ${pickupDate}</span>
            <span><strong>Departure:</strong> ${departureTime}</span>
          </div>

          <div style="margin-top:10px;padding-top:8px;border-top:1px solid #f1f5f9">
            <a class="btn btn-primary btn-sm btn-block select-vehicle-link" style="display:block;text-align:center;text-decoration:none" href="cargo-details.html?vehicle=${v._id || v.id}">
              Select Space & Calculate CBM →
            </a>
          </div>
        </div>
      `;
    }

    // Attach click handler for storing selected vehicle in sessionStorage
    document.getElementById("results").addEventListener("click", (e) => {
      const link = e.target.closest(".select-vehicle-link");
      if (link) {
        const url = new URL(link.href, window.location.origin);
        const vId = url.searchParams.get("vehicle");
        const found = allVehicles.find((x) => (x._id || x.id) === vId);
        if (found) {
          sessionStorage.setItem("selectedVehicle", JSON.stringify({
            vehicleId: found._id || found.id,
            availableCapacityCBM: Number(found.availableCapacityCBM || 0),
            availableWeightKG: Number(found.availableWeightKG || 0),
            totalCapacityCBM: Number(found.totalCapacityCBM || 0),
            providerName: found.providerName || "Provider",
            vehicleType: found.vehicleType || "Commercial Vehicle",
            vehicleNumber: found.vehicleNumber || "-",
            fromLocation: found.fromLocation || "-",
            toLocation: found.toLocation || "-",
            route: [found.fromLocation, found.toLocation].filter(Boolean),
            pickupDate: found.pickupDate || "-",
            departureTime: found.departureTime || "Flexible",
            pricePerCBM: Number(found.pricePerCBM || 0),
            status: found.status || "Available"
          }));
        }
      }
    });

    function applyFilters() {
      const fromInput = document.getElementById("from").value.trim().toLowerCase();
      const toInput = document.getElementById("to").value.trim().toLowerCase();
      const dateInput = document.getElementById("pickupDate") ? document.getElementById("pickupDate").value : "";
      const cbmInput = parseFloat(document.getElementById("cbm").value);
      const weightInput = parseFloat(document.getElementById("weight").value);
      const maxPriceInput = parseFloat(document.getElementById("maxPrice").value);

      const filtered = allVehicles.filter((v) => {
        // Rule: Only show vehicles with status "Available"
        const currentStatus = (v.status || "Available").trim().toLowerCase();
        if (currentStatus !== "available") return false;

        // Rule: From should match vehicle fromLocation
        if (fromInput) {
          const fromLoc = (v.fromLocation || "").toLowerCase();
          if (!fromLoc.includes(fromInput)) return false;
        }

        // Rule: To should match vehicle toLocation
        if (toInput) {
          const toLoc = (v.toLocation || "").toLowerCase();
          if (!toLoc.includes(toInput)) return false;
        }

        // Rule: Pickup date should match pickupDate
        if (dateInput) {
          if (v.pickupDate !== dateInput) return false;
        }

        // Rule: Required CBM must be <= availableCapacityCBM
        if (!isNaN(cbmInput) && cbmInput > 0) {
          if (cbmInput > Number(v.availableCapacityCBM || 0)) return false;
        }

        // Rule: Required weight must be <= availableWeightKG
        if (!isNaN(weightInput) && weightInput > 0) {
          if (weightInput > Number(v.availableWeightKG || 0)) return false;
        }

        // Max price filter (optional input present in form)
        if (!isNaN(maxPriceInput) && maxPriceInput > 0) {
          if (Number(v.pricePerCBM || 0) > maxPriceInput) return false;
        }

        // Vehicle type filter chip
        if (activeFilters.vehicleType && activeFilters.vehicleType !== "All") {
          if (v.vehicleType !== activeFilters.vehicleType) return false;
        }

        return true;
      });

      const container = document.getElementById("results");
      const countEl = document.getElementById("results-count");
      if (countEl) {
        countEl.textContent = filtered.length + " space" + (filtered.length === 1 ? "" : "s") + " available";
      }

      if (!filtered.length) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;text-align:center;padding:48px 16px">
            <div class="empty-state-icon" style="font-size:2.5rem;margin-bottom:12px">🚛</div>
            <p style="font-size:1rem;color:var(--cs-slate-600);font-weight:600">No matching cargo space available.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(renderVehicleCard).join("");
    }

    async function fetchVehicles() {
      const container = document.getElementById("results");
      container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#64748b">Loading cargo space from database...</div>';

      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        if (response.ok && data.success && Array.isArray(data.data)) {
          allVehicles = data.data;
          applyFilters();
        } else {
          container.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;text-align:center;padding:48px 16px">
              <p style="font-size:1rem;color:#dc2626;font-weight:600">Failed to load cargo space from database.</p>
            </div>
          `;
        }
      } catch (err) {
        console.error("Fetch vehicles error:", err);
        container.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;text-align:center;padding:48px 16px">
            <p style="font-size:1rem;color:#dc2626;font-weight:600">Could not connect to CargoHive server. Ensure backend is running on port 5000.</p>
          </div>
        `;
      }
    }

    // Form submit listener
    document.getElementById("search-form").addEventListener("submit", (e) => {
      e.preventDefault();
      applyFilters();
      if (window.CS && typeof CS.toast === "function") {
        CS.toast("Search filters applied", "info");
      }
    });

    // Reset button listener
    document.getElementById("reset-btn").addEventListener("click", () => {
      document.getElementById("search-form").reset();
      activeFilters.vehicleType = "All";
      document.querySelectorAll(".filter-chip").forEach((c) => c.classList.remove("active"));
      if (defaultChip) defaultChip.classList.add("active");
      applyFilters();
    });

    // Prefill from query params if available
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const fromVal = urlParams.get("from");
      const toVal = urlParams.get("to");
      const dateVal = urlParams.get("pickupDate");
      const cbmVal = urlParams.get("cbm");
      const weightVal = urlParams.get("weight");

      if (fromVal) document.getElementById("from").value = fromVal;
      if (toVal) document.getElementById("to").value = toVal;
      if (dateVal && document.getElementById("pickupDate")) document.getElementById("pickupDate").value = dateVal;
      if (cbmVal) document.getElementById("cbm").value = cbmVal;
      if (weightVal) document.getElementById("weight").value = weightVal;
    } catch (e) {}

    // Initial load
    fetchVehicles();
  </script>
</body>
</html>
